<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toglogg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #0b0e13;
  --bg-2: #12161d;
  --panel: #12161d;
  --panel-2: #171c25;
  --ink: #eef1f5;
  --ink-soft: #8b93a1;
  --line: rgba(238,241,245,0.09);
  --line-soft: rgba(238,241,245,0.12);
  --lok: #4f8ef7;
  --lok-ink: #cfe0ff;
  --lok-bg: rgba(79,142,247,0.16);
  --motorvogn: #33c1a3;
  --motorvogn-ink: #bdf3e6;
  --motorvogn-bg: rgba(51,193,163,0.16);
  --cream: #eef1f5;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
  --radius: 10px;
  --font-display: 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: dark; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f6f8;
    --bg-2: #eceef2;
    --panel: #ffffff;
    --panel-2: #ffffff;
    --ink: #12161d;
    --ink-soft: #5a6270;
    --line: rgba(18,22,29,0.1);
    --line-soft: rgba(18,22,29,0.14);
    --lok-bg: #e4edfe;
    --lok-ink: #1e4faa;
    --motorvogn-bg: #ddf6ef;
    --motorvogn-ink: #157a63;
    --cream: #12161d;
    --shadow: 0 10px 24px rgba(18,22,29,0.08);
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body { min-height: 100vh; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

.auth-box { max-width: 420px; margin: 64px auto; }
.auth-h1 {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 38px);
  font-weight: 700;
  margin: 0 0 10px;
  line-height: 1.1;
}
.auth-tabs { display: flex; gap: 8px; margin: 20px 0 22px; }
.auth-tab {
  flex: 1;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
  padding: 10px;
  border-radius: 999px;
  cursor: pointer;
}
.auth-tab.active { background: var(--lok); color: #fff; border-color: var(--lok); }

header.hero { padding: 48px 0 28px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.board-label { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.02em; color: var(--lok); margin: 0; font-weight: 600; }
h1 { font-family: var(--font-display); font-size: clamp(32px, 5vw, 48px); font-weight: 700; margin: 0 0 10px; line-height: 1.05; color: var(--cream); }
.sub { font-size: 16px; color: var(--ink-soft); max-width: 520px; line-height: 1.5; margin: 0 0 24px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; }
.stats { display: flex; gap: 28px; }
.stat { display: flex; flex-direction: column; }
.stat .n { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--cream); line-height: 1; }
.stat .l { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

button.primary {
  font-family: var(--font-body); font-weight: 600; font-size: 15px;
  background: var(--lok); color: #fff; border: none; padding: 13px 22px;
  border-radius: var(--radius); cursor: pointer; transition: transform 0.12s ease, background 0.15s ease;
}
button.primary:hover { background: #3f7bdc; }
button.primary:active { transform: scale(0.97); }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 28px; }
.tab {
  font-family: var(--font-display); font-size: 14px; letter-spacing: 0.01em;
  background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
  padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: all 0.15s ease;
}
.tab.active { background: var(--lok); color: #fff; border-color: var(--lok); }
.tab:hover:not(.active) { border-color: var(--line-soft); color: var(--cream); }

select#typeFilter, select#statusFilter {
  font-family: var(--font-body); font-size: 14px; background: transparent; color: var(--cream);
  border: 1px solid var(--line); padding: 9px 14px; border-radius: 999px; cursor: pointer;
}
select#typeFilter option, select#statusFilter option { color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  background: var(--panel-2); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  cursor: pointer; display: flex; flex-direction: column; transition: transform 0.15s ease;
}
.card:hover { transform: translateY(-3px); }
.card .thumb { width: 100%; aspect-ratio: 4 / 3; background: #0e1a22; overflow: hidden; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .info { padding: 12px 14px 14px; }
.badge {
  display: inline-block; font-family: var(--font-display); font-size: 11px; font-weight: 500;
  letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; margin-right: 6px;
}
.badge.lok { background: var(--lok-bg); color: var(--lok-ink); }
.badge.motorvogn { background: var(--motorvogn-bg); color: var(--motorvogn-ink); }
.card .tittel { font-weight: 600; color: var(--ink); font-size: 15px; margin: 8px 0 3px; }
.card .meta { font-size: 12.5px; color: var(--ink-soft); }

.empty { text-align: center; padding: 70px 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--ink-soft); }
.empty h3 { font-family: var(--font-display); color: var(--cream); font-size: 22px; margin: 0 0 8px; font-weight: 600; }

.overlay {
  position: fixed; inset: 0; background: rgba(10,15,19,0.72); display: none;
  align-items: center; justify-content: center; padding: 24px; z-index: 50;
}
.overlay.show { display: flex; }
.modal {
  background: var(--panel); color: var(--ink); width: 100%; max-width: 460px; max-height: 88vh;
  overflow-y: auto; border-radius: 14px; padding: 26px 26px 22px; position: relative;
}
.modal.wide { max-width: 640px; }
.modal h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0 0 18px; color: var(--ink); }
.close-x {
  position: absolute; top: 16px; right: 16px; background: none; border: none;
  font-size: 22px; line-height: 1; color: var(--ink-soft); cursor: pointer; padding: 4px;
}
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 16px 0 6px; }
label:first-of-type { margin-top: 0; }
input[type="text"], input[type="date"], input[type="password"], select, textarea {
  width: 100%; font-family: var(--font-body); font-size: 15px; padding: 10px 12px;
  border-radius: 8px; border: 1px solid var(--line-soft); background: var(--panel-2); color: var(--ink);
}
textarea { resize: vertical; min-height: 60px; }
input[type="file"] {
  width: 100%; font-size: 13px; padding: 10px; border: 1px dashed var(--line-soft);
  border-radius: 8px; background: var(--panel-2);
}
.preview { margin-top: 10px; width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; display: none; }
.cat-choice { display: flex; gap: 10px; }
.cat-btn {
  flex: 1; padding: 12px; border-radius: 8px; border: 1.5px solid var(--line-soft);
  background: var(--panel-2); color: var(--ink); font-family: var(--font-display); font-size: 14px;
  cursor: pointer; text-align: center;
}
.cat-btn.sel.lok { border-color: var(--lok); background: var(--lok-bg); color: var(--lok-ink); }
.cat-btn.sel.motorvogn { border-color: var(--motorvogn); background: var(--motorvogn-bg); color: var(--motorvogn-ink); }

.form-error { color: #e2504f; font-size: 13px; margin-top: 6px; display: none; }

.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.btn {
  font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 11px 18px;
  border-radius: 8px; border: 1px solid var(--line-soft); background: var(--panel-2);
  color: var(--ink); cursor: pointer;
}
.btn.save { background: var(--lok); border-color: var(--lok); color: #fff; }
.btn.danger { background: transparent; color: #e2504f; border-color: #e2504f; }

.view-img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; background: #0e1a22; }
.view-info { margin-top: 16px; }
.view-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 10px 0 4px; }
.view-meta { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
.view-note { margin-top: 10px; font-size: 14.5px; line-height: 1.5; }


/* ---------- Visningsbytte Bilder / Typer ---------- */
.view-switch {
  display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 22px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
}
.view-btn {
  font-family: var(--font-body); font-weight: 600; font-size: 14px;
  background: transparent; color: var(--ink-soft); border: none;
  padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: all 0.15s ease;
}
.view-btn.active { background: var(--lok); color: #fff; }
.view-btn:hover:not(.active) { color: var(--cream); }

/* ---------- Bilder uten foto ---------- */
.thumb.thumb-empty {
  display: flex; align-items: center; justify-content: center;
  background: repeating-linear-gradient(135deg, var(--panel) 0 10px, var(--panel-2) 10px 20px);
  color: var(--ink-soft); font-size: 12.5px;
}
.view-img.placeholder {
  display: flex; align-items: center; justify-content: center; min-height: 180px;
  color: var(--ink-soft); font-size: 14px;
  background: repeating-linear-gradient(135deg, var(--panel) 0 12px, var(--panel-2) 12px 24px);
  border: 1px dashed var(--line-soft);
}

/* ---------- Typeoversikt ---------- */
.type-seksjon { margin-bottom: 32px; }
.type-seksjon-tittel {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  margin: 0 0 12px; color: var(--cream);
}
.type-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.type-chip {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
  padding: 12px 14px; border-radius: 10px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  font-family: var(--font-body); transition: border-color 0.15s ease, transform 0.12s ease;
}
.type-chip:hover { border-color: var(--line-soft); transform: translateY(-2px); }
.type-chip-navn { font-weight: 700; font-size: 15px; }
.type-chip-antall { font-size: 12px; color: var(--ink-soft); }
.type-seksjon.lok .type-chip.harsett { border-color: var(--lok); background: var(--lok-bg); }
.type-seksjon.motorvogn .type-chip.harsett { border-color: var(--motorvogn); background: var(--motorvogn-bg); }
.type-chip.harsett .type-chip-antall { color: var(--ink); font-weight: 600; }

/* ---------- Typedetalj (sjekkliste) ---------- */
.type-detalj-topp { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.type-detalj-tittel { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin: 0 0 14px; color: var(--cream); }
.hurtig-sett { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: stretch; }
.fil-knapp { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hurtig-sett input { flex: 1; max-width: 260px; }
.hurtig-sett .form-error { margin: 0 0 14px; }
.enhets-liste { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.enhets-rad {
  display: flex; align-items: center; gap: 14px; padding: 8px 14px 8px 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  transition: border-color 0.15s ease;
}
.enhets-rad:hover { border-color: var(--line-soft); }
.thumb.thumb-liten {
  width: 64px; height: 48px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #0e1a22;
}
.thumb.thumb-liten img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.thumb-liten.thumb-empty { font-size: 10px; text-align: center; }
.enhets-midt { flex: 1; min-width: 0; }
.enhets-kode { font-weight: 700; font-size: 16px; color: var(--ink); }
.enhets-under { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.enhets-sett {
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--motorvogn-bg); color: var(--motorvogn-ink);
}


/* ---------- Status ---------- */
:root {
  --venter: #e0a43a; --venter-bg: rgba(224,164,58,0.16); --venter-ink: #f5d9a6;
  --avvist: #e2504f; --avvist-bg: rgba(226,80,79,0.15); --avvist-ink: #f6b9b8;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --venter-bg: #fbefd9; --venter-ink: #8a5a0b;
    --avvist-bg: #fbe1e1; --avvist-ink: #a32424;
  }
}
.status {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  white-space: nowrap; vertical-align: middle;
}
.status.st-godkjent { background: var(--motorvogn-bg); color: var(--motorvogn-ink); }
.status.st-venter { background: var(--venter-bg); color: var(--venter-ink); }
.status.st-avvist { background: var(--avvist-bg); color: var(--avvist-ink); }
.status.st-mangler { background: transparent; color: var(--ink-soft); border: 1px dashed var(--line-soft); }
.avvist-boks {
  display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; line-height: 1.45;
  background: var(--panel-2); border: 1px solid var(--line-soft); color: var(--ink);
}
.tab-teller { font-weight: 700; }

/* ---------- Godkjenning ---------- */
.kontroll-kort {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px;
}
.kontroll-bilde { display: block; border-radius: 8px; overflow: hidden; background: #0e1a22; }
.kontroll-bilde img { width: 100%; max-height: 420px; object-fit: contain; display: block; }
.kontroll-info { color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.kontroll-kode { font-size: 24px; font-weight: 700; }
.kontroll-meta { font-size: 13.5px; color: var(--ink-soft); }
.kontroll-notat { font-size: 14px; line-height: 1.45; }
.kontroll-info .modal-actions { margin-top: 4px; }
@media (max-width: 700px) { .kontroll-kort { grid-template-columns: 1fr; } }

/* ---------- Flåte-rutenett ---------- */
.fremdrift { margin: 0 0 16px; }
.fremdrift-tekst { color: var(--cream); font-size: 15px; margin-bottom: 6px; }
.fremdrift-bar, .type-chip-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fremdrift-bar i, .type-chip-bar i { display: block; height: 100%; background: var(--motorvogn); border-radius: 999px; }
.type-chip-bar { width: 100%; height: 4px; margin-top: 4px; }
.type-seksjon.lok .type-chip-bar i { background: var(--lok); }
.hjelp { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.enhet-rutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-bottom: 10px; }
.enhet-rute {
  font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 12px 4px; border-radius: 8px;
  cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.enhet-rute:hover { transform: translateY(-1px); border-color: var(--line-soft); }
.enhet-rute.jobber { opacity: 0.5; cursor: progress; }
.r-ikke { border-style: dashed !important; }
.r-uten_bilde { border-style: dashed !important; color: var(--ink) !important; }
.r-venter { background: var(--venter-bg) !important; border-color: var(--venter) !important; color: var(--venter-ink) !important; }
.r-godkjent { background: var(--motorvogn-bg) !important; border-color: var(--motorvogn) !important; color: var(--motorvogn-ink) !important; }
.r-avvist { background: var(--avvist-bg) !important; border-color: var(--avvist) !important; color: var(--avvist-ink) !important; }
.forklaring { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 22px; font-size: 12px; }
.forklaring span { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
.liste-tittel { font-size: 16px; color: var(--cream); margin: 22px 0 0; }
.kontroll-ai { font-size: 13px; color: var(--ink-soft); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }

/* ---------- Melding ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-soft); border-radius: 10px;
  padding: 12px 18px; font-size: 14px; box-shadow: var(--shadow); transition: all 0.2s ease; z-index: 100;
  max-width: calc(100% - 32px);
}
.toast.vis { opacity: 1; transform: translate(-50%, 0); }
.toast.ok { border-color: var(--motorvogn); }
.toast.feil { border-color: var(--avvist); }
.toast.venter { border-color: var(--venter); }

@media (max-width: 480px) {
  header.hero { padding: 32px 0 22px; }
  .stats { gap: 18px; }
  .auth-box { margin: 32px auto; }
}


/* ---------- Ny opplasting / oversikt ---------- */
.stat .n small { font-size: 18px; color: var(--ink-soft); font-weight: 600; }
.last-opp-knapp {
  display: inline-flex; align-items: center; gap: 8px; margin: 0; cursor: pointer;
  font-family: var(--font-body); font-weight: 700; font-size: 16px; padding: 15px 26px;
  background: var(--lok); color: #fff !important; border-radius: var(--radius); transition: transform 0.12s ease, background 0.15s ease;
}
.last-opp-knapp:hover { background: #3f7bdc; }
.last-opp-knapp:active { transform: scale(0.97); }
.type-chips.store { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.type-chips.store .type-chip { padding: 16px; }
.type-chips.store .type-chip-navn { font-size: 18px; }
.type-chips.store .type-chip.harsett { border-color: var(--motorvogn); background: var(--motorvogn-bg); }
.type-chip.komplett { border-color: #e0a43a !important; }
.enhet-rute:disabled { cursor: default; opacity: 0.75; }
.enhet-rute:disabled:hover { transform: none; }
.enhet-rute.med-bilde { background-size: cover; background-position: center; position: relative; overflow: hidden; color: #fff !important; }
.enhet-rute.med-bilde::before { content: ""; position: absolute; inset: 0; background: rgba(10, 60, 50, 0.55); }
.enhet-rute.med-bilde span { position: relative; }
.resultat-rad { display: flex; gap: 14px; align-items: flex-start; padding: 12px; border: 1px solid var(--line-soft); border-radius: 10px; margin-bottom: 10px; }
.resultat-rad.jobber { opacity: 0.7; }
.resultat-rad.ok { border-color: var(--motorvogn); background: var(--motorvogn-bg); }
.resultat-rad.venter { border-color: var(--venter); }
.resultat-rad.feil { border-color: var(--avvist); }
.resultat-bilde { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: #0e1a22; }
.resultat-tekst { flex: 1; min-width: 0; }
.resultat-tittel { font-weight: 700; font-size: 16px; color: var(--ink); }
.resultat-under { font-size: 13.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.4; }
.velger { margin-top: 10px; }
.feil-knapp { margin-top: 10px; padding: 7px 14px; font-size: 13px; color: var(--avvist); border-color: var(--avvist); background: transparent; }
.velger-rad { display: flex; flex-wrap: wrap; gap: 8px; }
.velger-rad select { flex: 1; min-width: 120px; width: auto; }
#viewVelger .velger { margin-top: 12px; }

</style>
</head>
<body>

<div class="wrap" id="authScreen" style="display:none;">
  <div class="auth-box">
    <p class="board-label">Toglogg</p>
    <h1 class="auth-h1">Samle alle motorvognsettene</h1>
    <p class="sub">Logg inn for å se samlingen din, eller opprett en bruker hvis du er ny.</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Logg inn</button>
      <button class="auth-tab" data-mode="register">Opprett bruker</button>
    </div>
    <form id="authForm">
      <label for="usernameInput">Brukernavn</label>
      <input type="text" id="usernameInput" autocomplete="username" placeholder="ditt-brukernavn">
      <label for="passwordInput">Passord</label>
      <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Minst 6 tegn">
      <div class="form-error" id="authError"></div>
      <div class="modal-actions">
        <button type="submit" class="btn save" id="authSubmit">Logg inn</button>
      </div>
    </form>
  </div>
</div>

<div class="wrap" id="appScreen" style="display:none;">
  <header class="hero">
    <div class="hero-top">
      <p class="board-label">Toglogg</p>
      <button class="btn" id="logoutBtn">Logg ut (<span id="whoami"></span>)</button>
    </div>
    <h1>Hvor mange har du sett?</h1>
    <p class="sub">Last opp et bilde, så finner AI ut hvilket tog og nummer det er og krysser det av.</p>
    <div class="hero-row">
      <div class="stats">
        <div class="stat"><span class="n"><span id="statSett">0</span><small> / <span id="statTotal">0</span></small></span><span class="l">sett</span></div>
        <div class="stat"><span class="n" id="statVenter">0</span><span class="l">venter kontroll</span></div>
        <div class="stat"><span class="n" id="statUkjent">0</span><span class="l">mangler nummer</span></div>
      </div>
      <label class="primary last-opp-knapp">
        📷 Last opp bilde
        <input type="file" id="opplastingInput" accept="image/*" multiple hidden>
      </label>
    </div>
  </header>

  <div class="view-switch">
    <button class="view-btn active" data-view="typer">Togtyper</button>
    <button class="view-btn" data-view="bilder">Mine bilder</button>
    <button class="view-btn" data-view="admin" id="adminTab" style="display:none;">Godkjenning <span class="tab-teller" id="adminTeller"></span></button>
  </div>

  <div id="typerArea"></div>

  <div id="bilderArea" style="display:none;">
    <div class="filters">
      <select id="statusFilter">
        <option value="alle">Alle bilder</option>
        <option value="godkjent">Sett ✓</option>
        <option value="venter">Venter kontroll</option>
        <option value="ukjent">Mangler nummer</option>
        <option value="avvist">Avvist</option>
      </select>
    </div>
    <div id="gridArea"></div>
  </div>

  <div id="adminArea" style="display:none;"></div>
</div>

<div class="overlay" id="resultatOverlay">
  <div class="modal wide">
    <button class="close-x" id="lukkResultat" aria-label="Lukk">×</button>
    <h2>Opplasting</h2>
    <div id="resultatListe"></div>
    <div class="modal-actions">
      <button class="btn save" id="ferdigResultat">Ferdig</button>
    </div>
  </div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="modal wide">
    <button class="close-x" id="closeView" aria-label="Lukk">×</button>
    <img class="view-img" id="viewImg" alt="">
    <div class="view-info">
      <span class="badge motorvogn" id="viewBadge"></span>
      <span class="status" id="viewStatus"></span>
      <div class="view-title" id="viewTitle"></div>
      <div class="view-meta" id="viewMeta"></div>
      <div class="avvist-boks" id="viewInfo"></div>
      <div id="viewVelger"></div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteBtn">Slett bildet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var STATUS = {
    ukjent: { tekst: 'Mangler nummer', klasse: 'st-mangler' },
    venter: { tekst: 'Venter kontroll', klasse: 'st-venter' },
    godkjent: { tekst: 'Sett ✓', klasse: 'st-godkjent' },
    avvist: { tekst: 'Avvist', klasse: 'st-avvist' },
    uten_bilde: { tekst: 'Mangler bilde', klasse: 'st-mangler' },
  };

  var enheter = [];
  var flate = {};          // { "BM 72": ["72-01", ...], ... }
  var typeRekkefolge = [];
  var aktivVisning = 'typer';
  var apenType = null;
  var aktivStatus = 'alle';
  var valgtId = null;
  var authMode = 'login';

  // ---------- Hjelpere ----------

  function $(id) { return document.getElementById(id); }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    opts.credentials = 'same-origin';
    return fetch('/api' + path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Noe gikk galt.');
        return data;
      });
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDato(iso) {
    var d = (iso || '').split('-');
    return d.length === 3 ? d[2] + '.' + d[1] + '.' + d[0] : (iso || '');
  }

  function visMelding(tekst, type) {
    var el = $('toast');
    el.textContent = tekst;
    el.className = 'toast vis ' + (type || '');
    clearTimeout(visMelding.t);
    visMelding.t = setTimeout(function () { el.className = 'toast'; }, 5000);
  }

  function statusFor(e) {
    var s = STATUS[e.status] || STATUS.ukjent;
    if (e.status === 'godkjent' && e.vurdertAvAi) return { tekst: 'Sett ✓ (AI)', klasse: s.klasse };
    return s;
  }

  function lagStatus(e) {
    var s = statusFor(e);
    var el = document.createElement('span');
    el.className = 'status ' + s.klasse;
    el.textContent = s.tekst;
    return el;
  }

  function erstattEnhet(ny) {
    var i = enheter.findIndex(function (x) { return x.id === ny.id; });
    if (i === -1) enheter.push(ny); else enheter[i] = ny;
  }

  function finnEnhet(type, kode) {
    return enheter.find(function (e) { return e.type === type && e.kode === kode; });
  }

  // ---------- Flåteliste ----------

  function lastInnFlate() {
    function hent(fil) {
      return fetch('/flate/' + fil, { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.typer) return;
          Object.keys(d.typer).forEach(function (t) {
            if (d.typer[t] && d.typer[t].length) { flate[t] = d.typer[t]; typeRekkefolge.push(t); }
          });
        })
        .catch(function () {});
    }
    flate = {}; typeRekkefolge = [];
    return hent('motorvogner.json').then(function () { return hent('lok.json'); });
  }

  // ---------- Bildekomprimering ----------

  function komprimerBilde(fil, maxBredde, maksBytes) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(fil);
      var image = new Image();
      image.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Kunne ikke lese bildet.')); };
      image.onload = function () {
        URL.revokeObjectURL(url);
        var forsok = [[maxBredde, 0.82], [maxBredde, 0.7], [Math.min(1280, maxBredde), 0.7], [Math.min(1024, maxBredde), 0.6], [800, 0.6]];
        function prov(i) {
          var bredde = Math.min(forsok[i][0], image.width);
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(bredde);
          canvas.height = Math.round(image.height * bredde / image.width);
          canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (!blob) return reject(new Error('Kunne ikke komprimere bildet.'));
            if (blob.size <= maksBytes || i === forsok.length - 1) return resolve(blob);
            prov(i + 1);
          }, 'image/jpeg', forsok[i][1]);
        }
        prov(0);
      };
      image.src = url;
    });
  }

  // ---------- Innlogging ----------

  function visApp(b) {
    $('whoami').textContent = b.username;
    $('adminTab').style.display = b.isAdmin ? '' : 'none';
    $('authScreen').style.display = 'none';
    $('appScreen').style.display = 'block';
    lastInnFlate().then(lastInn);
    if (b.isAdmin) oppdaterAdminTeller();
  }

  function visAuth() {
    $('authScreen').style.display = 'block';
    $('appScreen').style.display = 'none';
  }

  api('/auth/me').then(function (d) { visApp(d.user); }).catch(visAuth);

  document.querySelectorAll('.auth-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.auth-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      authMode = tab.getAttribute('data-mode');
      $('authSubmit').textContent = authMode === 'login' ? 'Logg inn' : 'Opprett bruker';
      $('authError').style.display = 'none';
    });
  });

  $('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('authError').style.display = 'none';
    api(authMode === 'login' ? '/auth/login' : '/auth/register', {
      method: 'POST',
      body: JSON.stringify({ username: $('usernameInput').value.trim(), password: $('passwordInput').value }),
    })
      .then(function (d) { visApp(d.user); })
      .catch(function (err) { $('authError').textContent = err.message; $('authError').style.display = 'block'; });
  });

  $('logoutBtn').addEventListener('click', function () {
    api('/auth/logout', { method: 'POST' }).finally(function () { enheter = []; visAuth(); });
  });

  // ---------- Data og visninger ----------

  function lastInn() {
    return api('/photos')
      .then(function (d) { enheter = d.enheter; oppdaterAlt(); })
      .catch(function () { enheter = []; oppdaterAlt(); });
  }

  function oppdaterAlt() {
    var total = 0, sett = 0;
    typeRekkefolge.forEach(function (t) {
      total += flate[t].length;
      flate[t].forEach(function (k) { var e = finnEnhet(t, k); if (e && e.status === 'godkjent') sett++; });
    });
    $('statSett').textContent = sett;
    $('statTotal').textContent = total;
    $('statVenter').textContent = enheter.filter(function (e) { return e.status === 'venter'; }).length;
    $('statUkjent').textContent = enheter.filter(function (e) { return e.status === 'ukjent'; }).length;
    if (aktivVisning === 'typer') { if (apenType) renderType(apenType); else renderTyper(); }
    if (aktivVisning === 'bilder') renderBilder();
  }

  function byttVisning(v) {
    aktivVisning = v;
    apenType = null;
    document.querySelectorAll('.view-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-view') === v); });
    $('typerArea').style.display = v === 'typer' ? 'block' : 'none';
    $('bilderArea').style.display = v === 'bilder' ? 'block' : 'none';
    $('adminArea').style.display = v === 'admin' ? 'block' : 'none';
    if (v === 'admin') lastInnAdmin(); else oppdaterAlt();
  }
  document.querySelectorAll('.view-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { byttVisning(btn.getAttribute('data-view')); });
  });

  // Togtyper – oversikt
  function renderTyper() {
    var area = $('typerArea');
    area.innerHTML = '';
    if (!typeRekkefolge.length) {
      area.innerHTML = '<div class="empty"><h3>Fant ingen togtyper</h3><p>Sjekk at public/flate/motorvogner.json er lastet opp.</p></div>';
      return;
    }
    var wrap = document.createElement('div');
    wrap.className = 'type-chips store';
    typeRekkefolge.forEach(function (t) {
      var koder = flate[t];
      var sett = koder.filter(function (k) { var e = finnEnhet(t, k); return e && e.status === 'godkjent'; }).length;
      var venter = koder.filter(function (k) { var e = finnEnhet(t, k); return e && e.status === 'venter'; }).length;
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'type-chip' + (sett > 0 ? ' harsett' : '') + (sett === koder.length ? ' komplett' : '');
      chip.innerHTML = '<span class="type-chip-navn">' + esc(t) + (sett === koder.length ? ' 🏆' : '') + '</span>' +
        '<span class="type-chip-antall">' + sett + ' / ' + koder.length + ' sett' + (venter ? ' · ' + venter + ' venter' : '') + '</span>' +
        '<span class="type-chip-bar"><i style="width:' + Math.round(100 * sett / koder.length) + '%"></i></span>';
      chip.addEventListener('click', function () { apenType = t; renderType(t); window.scrollTo(0, 0); });
      wrap.appendChild(chip);
    });
    area.appendChild(wrap);
  }

  // Togtyper – én type med alle numre
  function renderType(t) {
    var area = $('typerArea');
    var koder = flate[t] || [];
    var sett = koder.filter(function (k) { var e = finnEnhet(t, k); return e && e.status === 'godkjent'; }).length;
    area.innerHTML =
      '<div class="type-detalj-topp"><button type="button" class="btn" id="tilbakeTyper">← Alle togtyper</button></div>' +
      '<h2 class="type-detalj-tittel">' + esc(t) + '</h2>' +
      '<div class="fremdrift"><div class="fremdrift-tekst"><b>' + sett + '</b> av ' + koder.length + ' sett</div>' +
      '<div class="fremdrift-bar"><i style="width:' + Math.round(100 * sett / (koder.length || 1)) + '%"></i></div></div>';
    $('tilbakeTyper').addEventListener('click', function () { apenType = null; renderTyper(); });

    var rutenett = document.createElement('div');
    rutenett.className = 'enhet-rutenett';
    koder.forEach(function (k) {
      var e = finnEnhet(t, k);
      var rute = document.createElement('button');
      rute.type = 'button';
      rute.className = 'enhet-rute ' + (e ? 'r-' + e.status : 'r-ikke');
      if (e && e.litenUrl && e.status === 'godkjent') {
        rute.classList.add('med-bilde');
        rute.style.backgroundImage = 'url("' + e.litenUrl + '")';
      }
      rute.innerHTML = '<span>' + esc(k) + '</span>';
      rute.title = e ? statusFor(e).tekst : 'Ikke sett ennå';
      if (e) rute.addEventListener('click', function () { visEnhet(e.id); });
      else rute.disabled = true;
      rutenett.appendChild(rute);
    });
    area.appendChild(rutenett);
    area.insertAdjacentHTML('beforeend',
      '<div class="forklaring"><span class="r-ikke">Ikke sett</span><span class="r-venter">Venter</span>' +
      '<span class="r-godkjent">Sett ✓</span><span class="r-avvist">Avvist</span></div>');
  }

  // Mine bilder
  function renderBilder() {
    var area = $('gridArea');
    var liste = enheter.slice().sort(function (a, b) { return b.opprettet - a.opprettet; });
    if (aktivStatus !== 'alle') liste = liste.filter(function (e) { return e.status === aktivStatus; });
    if (!liste.length) {
      area.innerHTML = '<div class="empty"><h3>' + (enheter.length ? 'Ingen treff' : 'Ingen bilder ennå') + '</h3><p>' +
        (enheter.length ? 'Prøv et annet filter.' : 'Trykk «Last opp bilde» for å komme i gang.') + '</p></div>';
      return;
    }
    var grid = document.createElement('div');
    grid.className = 'grid';
    liste.forEach(function (e) {
      var card = document.createElement('div');
      card.className = 'card';
      card.addEventListener('click', function () { visEnhet(e.id); });
      card.innerHTML = '<div class="thumb">' + (e.litenUrl ? '<img loading="lazy" alt="" src="' + esc(e.litenUrl) + '">' : '') + '</div>';
      var info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = (e.type ? '<span class="badge motorvogn">' + esc(e.type) + '</span>' : '');
      info.appendChild(lagStatus(e));
      info.insertAdjacentHTML('beforeend', '<div class="tittel">' + esc(e.kode || 'Ukjent nummer') + '</div>' +
        '<div class="meta">' + esc(formatDato(e.dato)) + '</div>');
      card.appendChild(info);
      grid.appendChild(card);
    });
    area.innerHTML = '';
    area.appendChild(grid);
  }
  $('statusFilter').addEventListener('change', function () { aktivStatus = this.value; renderBilder(); });

  // ---------- Velg type og nummer selv ----------

  function lagVelger(enhet, ferdig) {
    var boks = document.createElement('div');
    boks.className = 'velger';
    var typeValg = '<option value="">Velg type …</option>' + typeRekkefolge.map(function (t) {
      return '<option' + (t === enhet.type ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
    boks.innerHTML =
      '<div class="velger-rad"><select class="v-type">' + typeValg + '</select>' +
      '<select class="v-kode" disabled><option value="">Velg nummer …</option></select>' +
      '<button type="button" class="btn save v-send" disabled>' + (enhet.status === 'godkjent' ? 'Rett og send til kontroll' : 'Send til kontroll') + '</button></div>' +
      '<div class="form-error v-feil"></div>';
    var selType = boks.querySelector('.v-type');
    var selKode = boks.querySelector('.v-kode');
    var send = boks.querySelector('.v-send');
    function fyllKoder() {
      var t = selType.value;
      selKode.innerHTML = '<option value="">Velg nummer …</option>' + (flate[t] || []).map(function (k) {
        var e = finnEnhet(t, k);
        var tatt = e && e.status === 'godkjent' && e.id !== enhet.id;
        return '<option value="' + esc(k) + '"' + (tatt ? ' disabled' : '') + (k === enhet.kode ? ' selected' : '') + '>' +
          esc(k) + (tatt ? ' (allerede sett)' : '') + '</option>';
      }).join('');
      selKode.disabled = !t;
      send.disabled = !selKode.value;
    }
    selType.addEventListener('change', fyllKoder);
    selKode.addEventListener('change', function () { send.disabled = !selKode.value; });
    send.addEventListener('click', function () {
      send.disabled = true;
      send.textContent = 'Sender …';
      api('/photos/' + enhet.id, { method: 'PATCH', body: JSON.stringify({ type: selType.value, kode: selKode.value }) })
        .then(function (d) { erstattEnhet(d.enhet); oppdaterAlt(); ferdig(d.enhet); })
        .catch(function (err) {
          var f = boks.querySelector('.v-feil');
          f.textContent = err.message; f.style.display = 'block';
          send.disabled = false; send.textContent = 'Send til kontroll';
        });
    });
    if (enhet.type) fyllKoder();
    return boks;
  }

  // ---------- Opplasting ----------

  $('opplastingInput').addEventListener('change', function (ev) {
    var filer = Array.prototype.slice.call(ev.target.files || []);
    ev.target.value = '';
    if (!filer.length) return;
    $('resultatListe').innerHTML = '';
    $('resultatOverlay').classList.add('show');
    var kjede = Promise.resolve();
    filer.forEach(function (fil) {
      var rad = document.createElement('div');
      rad.className = 'resultat-rad';
      rad.innerHTML = '<img class="resultat-bilde" alt="" src="' + URL.createObjectURL(fil) + '">' +
        '<div class="resultat-tekst"><div class="resultat-tittel">Venter …</div><div class="resultat-under"></div></div>';
      $('resultatListe').appendChild(rad);
      kjede = kjede.then(function () { return lastOpp(fil, rad); });
    });
    kjede.then(function () { oppdaterAlt(); if ($('adminTab').style.display !== 'none') oppdaterAdminTeller(); });
  });

  function lastOpp(fil, rad) {
    var tittel = rad.querySelector('.resultat-tittel');
    var under = rad.querySelector('.resultat-under');
    tittel.textContent = 'Laster opp og leser nummeret …';
    rad.classList.add('jobber');
    return Promise.all([komprimerBilde(fil, 1600, 1800000), komprimerBilde(fil, 1280, 550000)])
      .then(function (b) {
        var fd = new FormData();
        fd.append('bilde', b[0], 'bilde.jpg');
        fd.append('liten', b[1], 'liten.jpg');
        return fetch('/api/opplasting', { method: 'POST', credentials: 'same-origin', body: fd });
      })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (d) {
          if (!res.ok) throw new Error(d.error || 'Opplastingen feilet.');
          return d;
        });
      })
      .then(function (d) {
        rad.classList.remove('jobber');
        if (d.enhet && d.resultat !== 'allerede') erstattEnhet(d.enhet);
        if (d.resultat === 'godkjent') {
          rad.classList.add('ok');
          tittel.textContent = '✓ ' + d.enhet.type + ' · ' + d.enhet.kode;
          under.textContent = 'AI leste «' + d.lest + '». Krysset av som sett!';
          leggTilFeilKnapp(rad, d.enhet);
        } else if (d.resultat === 'allerede') {
          rad.classList.add('info');
          tittel.textContent = d.enhet.type + ' · ' + d.enhet.kode;
          under.textContent = 'Du har allerede denne som sett. Bildet ble ikke lagret.';
        } else {
          rad.classList.add('venter');
          tittel.textContent = 'Fant ikke nummeret';
          under.textContent = d.aiFeil ? 'AI-kontrollen feilet (' + d.aiFeil + '). Velg type og nummer selv:'
            : (d.lest ? 'AI leste «' + d.lest + '», men det står ikke i listen. Velg selv:' : (d.enhet.aiNotat || 'Velg type og nummer selv:'));
          rad.querySelector('.resultat-tekst').appendChild(lagVelger(d.enhet, function (ny) {
            rad.classList.remove('venter'); rad.classList.add('info');
            tittel.textContent = ny.type + ' · ' + ny.kode;
            under.textContent = 'Sendt til manuell kontroll.';
            var v = rad.querySelector('.velger'); if (v) v.remove();
          }));
        }
      })
      .catch(function (err) {
        rad.classList.remove('jobber'); rad.classList.add('feil');
        tittel.textContent = 'Feil';
        under.textContent = err.message;
      });
  }

  // «Dette er feil»: brukeren retter AI-svaret, og bildet går til manuell kontroll.
  function leggTilFeilKnapp(rad, enhet) {
    var tekst = rad.querySelector('.resultat-tekst');
    var knapp = document.createElement('button');
    knapp.type = 'button';
    knapp.className = 'btn feil-knapp';
    knapp.textContent = 'Dette er feil';
    knapp.addEventListener('click', function () {
      knapp.remove();
      rad.classList.remove('ok'); rad.classList.add('venter');
      rad.querySelector('.resultat-under').textContent = 'Velg riktig type og nummer:';
      tekst.appendChild(lagVelger(enhet, function (ny) {
        rad.classList.remove('venter'); rad.classList.add('info');
        rad.querySelector('.resultat-tittel').textContent = ny.type + ' · ' + ny.kode;
        rad.querySelector('.resultat-under').textContent = 'Rettet. Sendt til manuell kontroll.';
        var v = rad.querySelector('.velger'); if (v) v.remove();
      }));
    });
    tekst.appendChild(knapp);
  }

  function lukkResultat() { $('resultatOverlay').classList.remove('show'); oppdaterAlt(); }
  $('lukkResultat').addEventListener('click', lukkResultat);
  $('ferdigResultat').addEventListener('click', lukkResultat);

  // ---------- Vis ett bilde ----------

  function visEnhet(id) {
    var e = enheter.find(function (x) { return x.id === id; });
    if (!e) return;
    valgtId = id;
    $('viewImg').src = e.bildeUrl || '';
    $('viewImg').style.display = e.bildeUrl ? 'block' : 'none';
    $('viewBadge').textContent = e.type || 'Ukjent type';
    var s = statusFor(e);
    $('viewStatus').className = 'status ' + s.klasse;
    $('viewStatus').textContent = s.tekst;
    $('viewTitle').textContent = e.kode || 'Ukjent nummer';
    $('viewMeta').textContent = formatDato(e.dato);
    var info = $('viewInfo');
    var tekst = '';
    if (e.status === 'avvist') tekst = 'Avvist' + (e.avvistGrunn ? ': ' + e.avvistGrunn : '') + '. Du kan velge riktig nummer under, eller slette bildet.';
    else if (e.status === 'venter') tekst = 'Venter på manuell kontroll.' + (e.aiNotat ? ' ' + e.aiNotat : '');
    else if (e.status === 'ukjent') tekst = (e.aiNotat ? e.aiNotat + ' ' : '') + 'Velg type og nummer:';
    else if (e.aiNotat) tekst = e.aiNotat;
    info.textContent = tekst;
    info.style.display = tekst ? 'block' : 'none';
    var v = $('viewVelger');
    v.innerHTML = '';
    if (e.status === 'ukjent' || e.status === 'avvist') {
      v.appendChild(lagVelger(e, function () { visEnhet(id); visMelding('Sendt til manuell kontroll.', 'venter'); }));
    } else if (e.status === 'godkjent' && e.vurdertAvAi) {
      var feilKnapp = document.createElement('button');
      feilKnapp.type = 'button';
      feilKnapp.className = 'btn feil-knapp';
      feilKnapp.textContent = 'Dette er feil';
      feilKnapp.addEventListener('click', function () {
        v.innerHTML = '<div class="resultat-under">Velg riktig type og nummer:</div>';
        v.appendChild(lagVelger(e, function () { visEnhet(id); visMelding('Rettet. Sendt til manuell kontroll.', 'venter'); }));
      });
      v.appendChild(feilKnapp);
    }
    $('viewOverlay').classList.add('show');
  }

  function lukkVis() { $('viewOverlay').classList.remove('show'); valgtId = null; }
  $('closeView').addEventListener('click', lukkVis);
  $('viewOverlay').addEventListener('click', function (e) { if (e.target === this) lukkVis(); });

  $('deleteBtn').addEventListener('click', function () {
    if (!valgtId || !confirm('Slette dette bildet?')) return;
    var id = valgtId;
    api('/photos/' + id, { method: 'DELETE' })
      .then(function () { enheter = enheter.filter(function (e) { return e.id !== id; }); lukkVis(); oppdaterAlt(); })
      .catch(function (err) { alert(err.message); });
  });

  // ---------- Godkjenning (admin) ----------

  function oppdaterAdminTeller(n) {
    function sett(x) { $('adminTeller').textContent = x ? '(' + x + ')' : ''; }
    if (typeof n === 'number') return sett(n);
    api('/admin/venter').then(function (d) { sett(d.enheter.length); }).catch(function () {});
  }

  function lastInnAdmin() {
    $('adminArea').innerHTML = '<div class="empty"><p>Henter …</p></div>';
    api('/admin/venter').then(function (d) { renderAdmin(d.enheter); })
      .catch(function (err) { $('adminArea').innerHTML = '<div class="empty"><h3>Feil</h3><p>' + esc(err.message) + '</p></div>'; });
  }

  function renderAdmin(liste) {
    oppdaterAdminTeller(liste.length);
    var area = $('adminArea');
    area.innerHTML = '';
    if (!liste.length) {
      area.innerHTML = '<div class="empty"><h3>Ingenting å kontrollere</h3><p>AI har tatt seg av resten.</p></div>';
      return;
    }
    area.insertAdjacentHTML('beforeend', '<p class="sub">Disse klarte ikke AI å bekrefte. Sjekk at bildet viser riktig nummer.</p>');
    liste.forEach(function (e) {
      var kort = document.createElement('div');
      kort.className = 'kontroll-kort';
      kort.innerHTML =
        '<a class="kontroll-bilde" href="' + esc(e.bildeUrl) + '" target="_blank" rel="noopener"><img src="' + esc(e.bildeUrl) + '" alt=""></a>' +
        '<div class="kontroll-info">' +
          '<span class="badge motorvogn">' + esc(e.type || '') + '</span>' +
          '<div class="kontroll-kode">' + esc(e.kode || 'Ukjent') + '</div>' +
          '<div class="kontroll-meta">Fra <b>' + esc(e.bruker) + '</b>' + (e.dato ? ' · ' + esc(formatDato(e.dato)) : '') + '</div>' +
          (e.aiNotat ? '<div class="kontroll-ai">🤖 ' + esc(e.aiNotat) + '</div>' : '') +
          '<input type="text" class="kontroll-grunn" placeholder="Grunn hvis du avviser (f.eks. feil nummer)">' +
          '<div class="form-error kontroll-feil"></div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn save" data-v="ja">Godkjenn ✓</button>' +
            '<button type="button" class="btn danger" data-v="nei">Avvis</button>' +
          '</div>' +
        '</div>';
      kort.querySelectorAll('button[data-v]').forEach(function (knapp) {
        knapp.addEventListener('click', function () {
          var godkjent = knapp.getAttribute('data-v') === 'ja';
          var grunn = kort.querySelector('.kontroll-grunn').value.trim();
          var feil = kort.querySelector('.kontroll-feil');
          feil.style.display = 'none';
          if (!godkjent && !grunn) {
            feil.textContent = 'Skriv en kort grunn så brukeren vet hva som er feil.';
            feil.style.display = 'block';
            return;
          }
          kort.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          api('/admin/vurder', { method: 'POST', body: JSON.stringify({ id: e.id, godkjent: godkjent, grunn: grunn }) })
            .then(function () { renderAdmin(liste.filter(function (x) { return x.id !== e.id; })); lastInn(); })
            .catch(function (err) {
              feil.textContent = err.message; feil.style.display = 'block';
              kort.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
            });
        });
      });
      area.appendChild(kort);
    });
  }
})();

</script>
</body>
</html>
